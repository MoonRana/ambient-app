<!DOCTYPE html>
<html>
<head><title>Generate Icons</title></head>
<body>
<canvas id="c128" width="128" height="128"></canvas>
<canvas id="c48" width="48" height="48"></canvas>
<canvas id="c16" width="16" height="16"></canvas>
<script>
function drawIcon(canvas) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width;
  const r = s * 0.22;
  // Background
  ctx.fillStyle = '#1a7fa8';
  ctx.beginPath();
  ctx.roundRect(0, 0, s, s, r);
  ctx.fill();
  // Mic body
  ctx.fillStyle = 'white';
  const mw = s * 0.25, mh = s * 0.38, mx = s/2 - mw/2, my = s * 0.12;
  const mr = s * 0.12;
  ctx.beginPath();
  ctx.roundRect(mx, my, mw, mh, mr);
  ctx.fill();
  // Arc
  ctx.strokeStyle = 'white';
  ctx.lineWidth = s * 0.07;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(s/2, s*0.38, s*0.22, Math.PI, 0);
  ctx.stroke();
  // Stem
  ctx.beginPath();
  ctx.moveTo(s/2, s*0.60);
  ctx.lineTo(s/2, s*0.74);
  ctx.stroke();
  // Base line
  ctx.beginPath();
  ctx.moveTo(s*0.36, s*0.74);
  ctx.lineTo(s*0.64, s*0.74);
  ctx.stroke();
}

['c128','c48','c16'].forEach(id => {
  const canvas = document.getElementById(id);
  drawIcon(canvas);
  const link = document.createElement('a');
  link.download = `icon-${canvas.width}.png`;
  link.href = canvas.toDataURL('image/png');
  link.textContent = `Download icon-${canvas.width}.png`;
  document.body.appendChild(link);
  document.body.appendChild(document.createElement('br'));
});
</script>
</body>
</html>
